{% extends "base.html" %}
{% block title %}Removed — Chuka Black Market{% endblock %}

{% block content %}
<section class="ticket-wrap">
  <div class="ticket">
    <span class="chip">Removed</span>
    <h1>"{{ listing['name'] }}" is off the board</h1>
    <p class="sub">Thanks for keeping the marketplace current. Sold something? Good stuff.</p>
    <a class="btn btn-orange" href="{{ url_for('index') }}">Back to the board</a>
    <a class="btn btn-outline" href="{{ url_for('sell') }}">Sell something else</a>
  </div>
</section>
{% endblock %}
